name: Release 21.02

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: '编译SDK版本'     
        required: true
        default: '24.10.4' 
        type: choice
        options:
        - 21.02.7
        - 22.03.7
        - 23.05.6
        - 24.10.4
      upload_artifact:
        description: '是否上传到Artifact'
        required: false
        type: boolean
        default: false
      upload_release:
        description: '是否上传到Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo -e "Total CPU cores\t: $(nproc)"
          cat /proc/cpuinfo | grep 'model name'
          free -h
          uname -a
          [ -f /proc/version ] && cat /proc/version
          [ -f /etc/issue.net ] && cat /etc/issue.net
          [ -f /etc/issue ] && cat /etc/issue
          ulimit -a

      - name: Download SDK
        run: |
          # 针对斐讯 N1 的正确架构路径
          TARGET="armvirt"
          SUBTARGET="64"
          VER="${{ inputs.sdk_version }}"
          
          # 获取 SDK 文件名（处理 .zst 格式）
          BASE_URL="https://downloads.openwrt.org/releases/$VER/targets/$TARGET/$SUBTARGET"
          SDK_FILE=$(curl -sL $BASE_URL/ | grep -oE 'openwrt-sdk-[^"]+\.tar\.zst' | head -n 1)
          
          if [ -z "$SDK_FILE" ]; then
            # 如果主站没发布，尝试从测试/归档源查找
            BASE_URL="https://archive.openwrt.org/releases/$VER/targets/$TARGET/$SUBTARGET"
            SDK_FILE=$(curl -sL $BASE_URL/ | grep -oE 'openwrt-sdk-[^"]+\.tar\.zst' | head -n 1)
          fi

          echo "Found SDK: $SDK_FILE"
          wget "$BASE_URL/$SDK_FILE"
          
          # 解压 zstd
          zstd -d "$SDK_FILE" -o sdk.tar
          tar -xf sdk.tar
          mv openwrt-sdk-* openwrt-sdk

      - name: Build
        id: build
        run: | 
          cd openwrt-sdk
          git clone  --depth=1 -b "${{ github.ref_name }}" https://github.com/papagaye744/luci-theme-design.git package/luci-theme-design
          ./scripts/feeds update -a && ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_luci-theme-design=y" >> .config
          make defconfig
          make package/luci-theme-design/compile V=s -j$(nproc)
          TARGET="$(find bin/ | grep  luci-theme-design)"
          echo "TARGET=$(pwd)/$TARGET"
          echo "TARGET=$(pwd)/$TARGET" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          
      - name : Upload to artifact
        uses: actions/upload-artifact@master
        if: steps.build.outputs.status == 'success' && github.event.inputs.upload_artifact == 'true' && !cancelled()
        with:
          name: luci-theme-design-${{ inputs.sdk_version }}
          path: ${{ steps.build.outputs.TARGET }}

      - name: Get tag
        id: tag
        uses: dawidd6/action-get-tag@v1
        if: steps.build.outputs.status == 'success' && github.event.inputs.upload_release == 'true' && !cancelled()
        with:
        # Optionally strip `v` prefix
          strip_v: false
          
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        if: steps.build.outputs.status == 'success' && github.event.inputs.upload_release == 'true' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.TARGET }}
            LICENSE
