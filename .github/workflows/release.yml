name: Bulid Theme for X86-64

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: '编译SDK版本'     
        required: true
        default: '25.12.0'
        type: choice
        options:
        - 25.12.0
      upload_artifact:
        description: '是否上传到Artifact'
        required: false
        type: boolean
        default: false
      upload_release:
        description: '是否上传到Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo -e "Total CPU cores\t: $(nproc)"
          cat /proc/cpuinfo | grep 'model name'
          free -h
          uname -a
          [ -f /proc/version ] && cat /proc/version
          [ -f /etc/issue.net ] && cat /etc/issue.net
          [ -f /etc/issue ] && cat /etc/issue
          ulimit -a

      - name: Restore SDK cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: sdk-cache
          key: openwrt-sdk-${{ inputs.sdk_version }}-x86-64-gcc-14.3.0-v1

      - name: Download SDK
        run: |
          declare -A sdkMap=()
          sdkMap["25.12.0"]="openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl"

          SDK=${sdkMap["${{ inputs.sdk_version }}"]}
          echo "USE SDK=$SDK"

          mkdir -p sdk-cache
          SDK_ARCHIVE="$(find sdk-cache -maxdepth 1 -type f \( -name '*.tar.zst' -o -name '*.tar.xz' \) -print -quit)"

          if [ -n "$SDK_ARCHIVE" ]; then
            echo "Using cached SDK archive: $SDK_ARCHIVE"
          else
            # 优先尝试主站，失败后再使用 archive；直接下载避免额外的 spider 请求。
            for EXT in tar.zst tar.xz; do
              for URL in \
                "https://downloads.openwrt.org/releases/${{ inputs.sdk_version }}/targets/x86/64/$SDK.Linux-x86_64.$EXT" \
                "https://archive.openwrt.org/releases/${{ inputs.sdk_version }}/targets/x86/64/$SDK.Linux-x86_64.$EXT"; do
                if curl --fail --location --show-error --retry 3 --retry-connrefused --retry-delay 2 "$URL" --output "sdk-cache/$SDK.$EXT"; then
                  SDK_ARCHIVE="sdk-cache/$SDK.$EXT"
                  echo "Downloaded SDK archive: $SDK_ARCHIVE"
                  break 2
                fi
              done
            done

            if [ -z "$SDK_ARCHIVE" ]; then
              echo "Error: Could not download the OpenWrt SDK."
              exit 1
            fi
          fi

          # 根据后缀执行解压
          case "$SDK_ARCHIVE" in
            *.tar.zst)
              zstd -d "$SDK_ARCHIVE" -o sdk_package.tar
              ;;
            *.tar.xz)
              xz -d "$SDK_ARCHIVE" -o sdk_package.tar
              ;;
            *)
              echo "Error: Unsupported SDK archive format: $SDK_ARCHIVE"
              exit 1
              ;;
          esac

          tar -xf sdk_package.tar
          # 动态匹配解压出的文件夹并重命名
          SDK_DIR="$(find . -mindepth 1 -maxdepth 1 -type d -name 'openwrt-sdk-*' -print -quit)"
          if [ -z "$SDK_DIR" ]; then
            echo "Error: Extracted SDK directory was not found."
            exit 1
          fi
          mv "$SDK_DIR" openwrt-sdk

      - name: Save SDK cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: sdk-cache
          key: openwrt-sdk-${{ inputs.sdk_version }}-x86-64-gcc-14.3.0-v1

      - name: Build
        id: build
        run: | 
          cd openwrt-sdk
          git clone  --depth=1 -b "${{ github.ref_name }}" https://github.com/uifor/luci-theme-design.git package/luci-theme-design
          ./scripts/feeds update -a && ./scripts/feeds install -a
          {
            echo "CONFIG_PACKAGE_luci-theme-design=y"
            echo "CONFIG_USE_APK=y"
          } >> .config
          make defconfig
          make package/luci-theme-design/compile V=s -j$(nproc)
          TARGET="$(find bin/ | grep  luci-theme-design)"
          echo "TARGET=$(pwd)/$TARGET"
          echo "TARGET=$(pwd)/$TARGET" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          
      - name : Upload to artifact
        uses: actions/upload-artifact@master
        if: steps.build.outputs.status == 'success' && github.event.inputs.upload_artifact == 'true' && !cancelled()
        with:
          name: luci-theme-design-${{ inputs.sdk_version }}
          path: ${{ steps.build.outputs.TARGET }}

      - name: Generate Tag Name
        id: tag
        if: steps.build.outputs.status == 'success' && github.event.inputs.upload_release == 'true' && !cancelled()
        run: |
          # 检查是否有当前的 git tag，如果没有则固定为 theme
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            TAG_NAME="theme"
          fi
          echo "final_tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        if: steps.build.outputs.status == 'success' && github.event.inputs.upload_release == 'true' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.final_tag }}
          name: ${{ steps.tag.outputs.final_tag }}
          files: ${{ steps.build.outputs.TARGET }}
          generate_release_notes: true
